# Local DEVELOPMENT stack: SQL Server 2022 + the proxy, with throwaway
# certificates and credentials generated by scripts/dev-setup.sh.
#
#   ./scripts/dev-setup.sh
#   docker compose up -d --build
#   sqlcmd -S tcp:localhost,14331 -U developer1 -P <printed password> -N -C
#
# For production use deploy/docker-compose.yml.
name: tds-auth-proxy-dev

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?run scripts/dev-setup.sh first}
      MSSQL_MEMORY_LIMIT_MB: "2048"
    volumes:
      - ./dev/mssql/mssql.conf:/var/opt/mssql/mssql.conf:ro
      - ./dev/certs/mssql.crt:/var/opt/mssql/certs/mssql.crt:ro
      - ./dev/certs/mssql.key:/var/opt/mssql/certs/mssql.key:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
    # Not published: clients reach SQL Server only through the proxy.

  # One-shot job creating the backend login the proxy uses.
  mssql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - ./dev/secrets:/run/secrets:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        pw=$$(cat /run/secrets/mssql-password)
        /opt/mssql-tools18/bin/sqlcmd -S mssql -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -v PW="$$pw" -Q "
          IF SUSER_ID('proxy_svc') IS NULL CREATE LOGIN proxy_svc WITH PASSWORD = '\$$(PW)', CHECK_POLICY = OFF
          ELSE ALTER LOGIN proxy_svc WITH PASSWORD = '\$$(PW)';
          IF IS_SRVROLEMEMBER('dbcreator', 'proxy_svc') = 0 ALTER SERVER ROLE dbcreator ADD MEMBER proxy_svc;"
        echo "backend login proxy_svc ready"

  tds-proxy:
    build: .
    image: tds-auth-proxy:dev
    depends_on:
      mssql-init:
        condition: service_completed_successfully
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:${PROXY_PORT:-14331}:14331"
      - "127.0.0.1:${ADMIN_PORT:-18080}:8080"
    volumes:
      - ./dev/config.yaml:/etc/tds-proxy/config.yaml:ro
      # Mount the secrets DIRECTORY (not single files) so that atomically
      # replaced secret files become visible inside the container.
      - ./dev/secrets:/run/secrets:ro
      - ./dev/certs:/certs:ro
