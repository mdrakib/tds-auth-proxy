# Builds standalone executables and publishes them as a GitHub Release.
# Trigger: push a version tag, e.g.  git tag v0.1.0 && git push origin v0.1.0
# (or run manually from the Actions tab with an existing tag).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build and publish, e.g. v0.1.0
        required: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  # One job builds every target and uploads straight to the Release. No
  # intermediate workflow artifacts are used, so the account's Actions
  # artifact-storage quota does not apply (release assets are stored separately).
  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          set -eu
          mkdir -p dist
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            export GOOS="${target%/*}" GOARCH="${target#*/}"
            name="tds-proxy_${TAG}_${GOOS}_${GOARCH}"
            ext=""; [ "$GOOS" = windows ] && ext=".exe"
            mkdir -p "dist/$name"
            go build -trimpath -ldflags "-s -w -X main.version=${TAG}" -o "dist/$name/tds-proxy$ext" ./cmd/tds-proxy
            cp README.md LICENSE config.example.yaml "dist/$name/"
            if [ "$GOOS" = windows ]; then
              (cd dist && zip -qr "$name.zip" "$name")
            else
              tar -C dist -czf "dist/$name.tar.gz" "$name"
            fi
            rm -rf "dist/$name"
          done
          (cd dist && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Create or update the GitHub Release
        run: |
          set -eu
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            pre=""
            case "$TAG" in *-*) pre="--prerelease";; esac   # v0.1.0-rc1 -> pre-release
            gh release create "$TAG" dist/* --verify-tag --title "tds-proxy $TAG" --generate-notes ${pre:+"$pre"}
          fi
