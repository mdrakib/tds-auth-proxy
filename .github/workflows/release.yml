# Builds standalone executables and publishes them as a GitHub Release.
# Trigger: push a version tag, e.g.  git tag v0.1.0 && git push origin v0.1.0
# (or run manually from the Actions tab with an existing tag).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build and publish, e.g. v0.1.0
        required: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {goos: windows, goarch: amd64}
          - {goos: windows, goarch: arm64}
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: darwin, goarch: amd64}
          - {goos: darwin, goarch: arm64}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -eu
          name="tds-proxy_${TAG}_${GOOS}_${GOARCH}"
          ext=""; [ "$GOOS" = windows ] && ext=".exe"
          mkdir -p "dist/$name"
          go build -trimpath -ldflags "-s -w -X main.version=${TAG}" -o "dist/$name/tds-proxy$ext" ./cmd/tds-proxy
          cp README.md config.example.yaml "dist/$name/"
          cd dist
          if [ "$GOOS" = windows ]; then zip -qr "$name.zip" "$name"; else tar -czf "$name.tar.gz" "$name"; fi
          rm -rf "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: tds-proxy-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create or update the GitHub Release
        run: |
          set -eu
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            pre=""
            case "$TAG" in *-*) pre="--prerelease";; esac   # v0.1.0-rc1 -> pre-release
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "tds-proxy $TAG" --generate-notes ${pre:+"$pre"}
          fi
